; Editor only. The embroidery programmer lives in legacy/code-esp32 and must
; not be flashed onto anything that can touch a CK-35 cartridge.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
	me-no-dev/ESPAsyncWebServer@1.2.4
	me-no-dev/AsyncTCP@1.1.1
